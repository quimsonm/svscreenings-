<svg width="1050" height="600" viewBox="0 0 1050 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradBack" x1="0" y1="0" x2="1050" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#004D78"/>
      <stop offset="100%" stop-color="#003352"/>
    </linearGradient>
    <clipPath id="roundedCardBack">
      <rect width="1050" height="600" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCardBack)">
    <!-- Background -->
    <rect width="1050" height="600" fill="url(#navyGradBack)"/>

    <!-- Subtle signal waves background decoration -->
    <circle cx="525" cy="180" r="100" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.08"/>
    <circle cx="525" cy="180" r="160" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.06"/>
    <circle cx="525" cy="180" r="220" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.04"/>

    <!-- Gold accent line top -->
    <rect x="485" y="38" width="80" height="4" rx="2" fill="#C8963E"/>

    <!-- Logo mark centered -->
    <g transform="translate(489, 62)">
      <rect width="72" height="72" rx="16" fill="#C8963E" opacity="0.15"/>
      <rect x="1" y="1" width="70" height="70" rx="15" stroke="#C8963E" stroke-width="1.5" fill="none"/>
      <g transform="translate(9, 5) scale(1.12)">
        <path d="M24 8C16 8 10 14 10 22C10 30 16 40 24 44C32 40 38 30 38 22C38 14 32 8 24 8Z" stroke="#C8963E" stroke-width="2.5" fill="none"/>
        <path d="M16 24C18 20 20 18 24 18" stroke="#C8963E" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M14 24C17 17 20 14 24 14" stroke="#C8963E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <path d="M18 24C20 22 22 21 24 21" stroke="#C8963E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <circle cx="24" cy="24" r="2.5" fill="#C8963E"/>
      </g>
    </g>

    <!-- Company name centered -->
    <text x="525" y="172" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">SIGNAL VIEW</text>
    <text x="525" y="200" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#C8963E" letter-spacing="5" text-anchor="middle">SCREENING SERVICES</text>

    <!-- Gold divider -->
    <rect x="445" y="226" width="160" height="2" rx="1" fill="#C8963E" opacity="0.5"/>

    <!-- Real QR Code (Google Reviews) -->
    <g transform="translate(387, 248)">
      <rect x="0" y="0" width="276" height="276" rx="14" fill="#FFFFFF"/>
      <rect x="4" y="4" width="268" height="268" rx="10" fill="#FAF8F5"/>
      <image x="18" y="18" width="240" height="240" href="data:image/png;base64," />
    </g>

    <!-- "Scan to review" text -->
    <text x="525" y="548" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C8963E" letter-spacing="4" text-anchor="middle" font-weight="500">SCAN TO LEAVE A REVIEW</text>

    <!-- Diagnostics CTA -->
    <text x="525" y="578" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#E5E0DA" letter-spacing="1.5" text-anchor="middle" opacity="0.5">For full diagnostic ultrasound studies visit svscreenings.com/diagnostics</text>
  </g>
</svg>
