<svg width="816" height="1056" viewBox="0 0 816 1056" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background (letter size 8.5x11 at 96dpi) -->
  <rect width="816" height="1056" fill="#FFFFFF"/>

  <!-- Logo mark centered -->
  <g transform="translate(372, 60)">
    <rect width="72" height="72" rx="16" fill="#000000" opacity="0.08"/>
    <rect x="1" y="1" width="70" height="70" rx="15" stroke="#000000" stroke-width="1.5" fill="none"/>
    <g transform="translate(9, 5) scale(1.12)">
      <path d="M24 8C16 8 10 14 10 22C10 30 16 40 24 44C32 40 38 30 38 22C38 14 32 8 24 8Z" stroke="#000000" stroke-width="2.5" fill="none"/>
      <path d="M16 24C18 20 20 18 24 18" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M14 24C17 17 20 14 24 14" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M18 24C20 22 22 21 24 21" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="24" cy="24" r="2.5" fill="#000000"/>
    </g>
  </g>

  <!-- Company name -->
  <text x="408" y="172" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#000000" letter-spacing="3" text-anchor="middle">SIGNAL VIEW</text>
  <text x="408" y="200" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#000000" letter-spacing="6" text-anchor="middle" opacity="0.6">SCREENING SERVICES</text>

  <!-- Divider -->
  <rect x="338" y="224" width="140" height="1.5" rx="0.75" fill="#000000" opacity="0.2"/>

  <!-- Headline -->
  <text x="408" y="290" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#000000" text-anchor="middle">How Did We Do?</text>

  <!-- Subtext -->
  <text x="408" y="340" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" opacity="0.7">Your feedback helps us serve you better.</text>
  <text x="408" y="370" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" opacity="0.7">We'd love to hear about your experience.</text>

  <!-- QR Code -->
  <g transform="translate(208, 420)">
    <rect x="-10" y="-10" width="420" height="420" rx="16" fill="#000000" opacity="0.04"/>
    <rect x="0" y="0" width="400" height="400" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <image x="20" y="20" width="360" height="360" href="data:image/png;base64," />
  </g>

  <!-- Instruction -->
  <text x="408" y="888" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#000000" text-anchor="middle">Scan the QR code to leave a Google review</text>

  <!-- Star rating visual -->
  <g transform="translate(283, 916)">
    <text font-family="Arial, sans-serif" font-size="40" fill="#000000" opacity="0.8">&#9733; &#9733; &#9733; &#9733; &#9733;</text>
  </g>

  <!-- Thank you -->
  <text x="408" y="990" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle" opacity="0.5">Thank you for choosing Signal View Screening Services</text>
  <text x="408" y="1018" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle" opacity="0.4">YOUR HEALTH. YOUR PEACE OF MIND.</text>
</svg>
