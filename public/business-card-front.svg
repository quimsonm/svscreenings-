<svg width="1050" height="600" viewBox="0 0 1050 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1050" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003352"/>
      <stop offset="100%" stop-color="#004D78"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#F5E6C8"/>
    </linearGradient>
    <clipPath id="roundedCard">
      <rect width="1050" height="600" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCard)">
    <!-- Background -->
    <rect width="1050" height="600" fill="url(#navyGrad)"/>

    <!-- Subtle signal wave pattern in background -->
    <circle cx="900" cy="480" r="180" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.15"/>
    <circle cx="900" cy="480" r="240" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.10"/>
    <circle cx="900" cy="480" r="300" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.07"/>
    <circle cx="900" cy="480" r="360" stroke="#0A6FA0" stroke-width="0.5" fill="none" opacity="0.04"/>

    <!-- Gold accent line top -->
    <rect x="60" y="50" width="80" height="3" rx="1.5" fill="#C8963E"/>

    <!-- Logo mark -->
    <g transform="translate(60, 80)">
      <rect width="64" height="64" rx="14" fill="#C8963E" opacity="0.15"/>
      <rect x="1" y="1" width="62" height="62" rx="13" stroke="#C8963E" stroke-width="1.5" fill="none"/>
      <g transform="translate(8, 4)">
        <path d="M24 8C16 8 10 14 10 22C10 30 16 40 24 44C32 40 38 30 38 22C38 14 32 8 24 8Z" stroke="#C8963E" stroke-width="2.5" fill="none"/>
        <path d="M16 24C18 20 20 18 24 18" stroke="#C8963E" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M14 24C17 17 20 14 24 14" stroke="#C8963E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <path d="M18 24C20 22 22 21 24 21" stroke="#C8963E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <circle cx="24" cy="24" r="2.5" fill="#C8963E"/>
      </g>
    </g>

    <!-- Company name -->
    <text x="140" y="108" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="1">SIGNAL VIEW</text>
    <text x="140" y="138" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C8963E" letter-spacing="4">SCREENING SERVICES</text>

    <!-- Gold divider -->
    <rect x="60" y="185" width="140" height="2" rx="1" fill="url(#goldLine)"/>

    <!-- Name -->
    <text x="60" y="240" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Mike Quimson</text>

    <!-- Title -->
    <text x="60" y="272" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#C8963E" letter-spacing="2">OWNER</text>

    <!-- Contact details -->
    <g transform="translate(60, 330)">
      <!-- Phone icon -->
      <g opacity="0.7">
        <rect width="20" height="20" fill="none"/>
        <path d="M4 3C4 2.45 4.45 2 5 2H9L11 6L8.5 7.5C9.57 9.67 11.33 11.43 13.5 12.5L15 10L19 12V16C19 16.55 18.55 17 18 17C9.72 17 3 10.28 3 2C3 1.45 3.45 1 4 1" stroke="#C8963E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0,0)"/>
      </g>
      <text x="30" y="15" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E5E0DA" letter-spacing="1">702.843.6612</text>
    </g>

    <g transform="translate(60, 370)">
      <!-- Email icon -->
      <g opacity="0.7">
        <rect x="1" y="4" width="18" height="14" rx="2" stroke="#C8963E" stroke-width="1.5" fill="none"/>
        <path d="M1 6L10 13L19 6" stroke="#C8963E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="30" y="16" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E5E0DA" letter-spacing="1">info@svscreenings.com</text>
    </g>

    <g transform="translate(60, 410)">
      <!-- Globe icon -->
      <g opacity="0.7">
        <circle cx="10" cy="10" r="9" stroke="#C8963E" stroke-width="1.5" fill="none"/>
        <path d="M1 10H19M10 1C12.5 4 13.5 7 13.5 10C13.5 13 12.5 16 10 19M10 1C7.5 4 6.5 7 6.5 10C6.5 13 7.5 16 10 19" stroke="#C8963E" stroke-width="1.3" fill="none"/>
      </g>
      <text x="30" y="16" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E5E0DA" letter-spacing="1">svscreenings.com</text>
    </g>

    <g transform="translate(60, 450)">
      <!-- Location icon -->
      <g opacity="0.7">
        <path d="M10 1C5.58 1 2 4.58 2 9C2 14.25 10 21 10 21C10 21 18 14.25 18 9C18 4.58 14.42 1 10 1Z" stroke="#C8963E" stroke-width="1.5" fill="none"/>
        <circle cx="10" cy="9" r="3" stroke="#C8963E" stroke-width="1.5" fill="none"/>
      </g>
      <text x="30" y="16" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E5E0DA" letter-spacing="1">Las Vegas, NV</text>
    </g>

    <!-- Tagline bottom -->
    <text x="60" y="545" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0A6FA0" letter-spacing="3" opacity="0.6">PREVENTATIVE ULTRASOUND SCREENINGS</text>

    <!-- Gold accent line bottom right -->
    <rect x="910" y="547" width="80" height="3" rx="1.5" fill="#C8963E"/>
  </g>
</svg>